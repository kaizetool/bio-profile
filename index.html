<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIZE BIO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
color:white;
text-align:center;
background:black;
overflow:hidden;
}

/* background video */

#bgvideo{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
z-index:-1;
opacity:0.55;
}

/* container */

.container{
margin-top:80px;
animation:fade 1.5s ease;
}

/* profile */

.profile img{
width:130px;
height:130px;
border-radius:50%;
border:3px solid white;
box-shadow:0 0 25px white;
}

/* username */

.username{
font-size:30px;
margin-top:12px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 10px white,0 0 20px white;
}

/* bio */

.bio{
opacity:0.8;
margin-top:6px;
font-size:14px;
}

/* links */

.links{
margin-top:30px;
}

.links a{
display:block;
width:260px;
margin:12px auto;
padding:13px;
border-radius:14px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
text-decoration:none;
color:white;
font-weight:600;
transition:0.35s;
border:1px solid rgba(255,255,255,0.2);
}

/* hover */

.links a:hover{
background:rgba(255,255,255,0.25);
transform:scale(1.07);
box-shadow:0 0 15px white;
}

/* footer */

.footer{
position:fixed;
bottom:12px;
width:100%;
font-size:13px;
opacity:0.7;
}

/* animation */

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<video autoplay muted loop id="bgvideo">
<source src="bg.mp4" type="video/mp4">
</video>

<audio autoplay loop>
